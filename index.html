*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--light);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}

.menu{display:flex;gap:8px;overflow:auto;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:4}.menu button{border:0;background:#eef3ef;color:var(--green);border-radius:12px;padding:9px 12px;white-space:nowrap}.menu button.active{background:var(--green);color:#fff}
main{max-width:1180px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#1c5b3c,#8cae83);color:#fff;border-radius:20px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.86}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 10px #17352208}.metric .num{font-size:25px;font-weight:800;margin-top:5px}.muted{color:var(--muted);font-size:13px}
.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.action{border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px;text-align:left;color:var(--text)}.action strong{display:block;margin-top:8px}.icon{font-size:24px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.primary{background:var(--green);color:#fff;border:0;border-radius:11px;padding:10px 14px}.secondary{background:#eef3ef;color:var(--green);border:0;border-radius:11px;padding:10px 14px}.danger{background:#fbeceb;color:var(--danger);border:0;border-radius:11px;padding:8px 11px}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.full{grid-column:1/-1}
.empty{padding:25px;text-align:center;color:var(--muted)} .toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}.toolbar input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}
.cameraBox{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:12px 0;background:#fafcf9}
.cameraPreview{max-width:100%;max-height:260px;border-radius:10px;margin-top:10px;display:none}
.ocrStatus{font-size:13px;color:var(--muted);margin-top:8px}
.notaReview{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.notaItem{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff}
.notaGrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}

@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}main{padding:12px}.hero{padding:18px}.form{grid-template-columns:1fr}.full{grid-column:auto}.top{height:64px}.menu{top:64px}}
.badge{display:inline-block;background:#eef3ef;color:var(--green);border-radius:999px;padding:4px 8px;font-size:12px}.money{font-weight:700}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.summary .card{min-width:150px;flex:1}

<script>
const SUPABASE_URL = 'https://tzlirbhljgqujrvgptfs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tkrE_2Tg8KY0JmGAbxshXg_SxlRepgM';
const supabaseHeaders = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

async function supabaseRequest(table, options = {}) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    ...options,
    headers: { ...supabaseHeaders, ...(options.headers || {}) }
  });
  if (!response.ok) throw new Error(await response.text());
  const texto = await response.text();
  return texto ? JSON.parse(texto) : null;
}

const modules=[
["inicio","🏠","Início"],["fazendas","🏡","Fazendas"],["talhoes","🌱","Talhões"],["safras","📅","Safras"],["aplicacoes","💧","Aplicações"],["plantio","🌾","Plantio"],["maquinas","🚜","Máquinas"],["diesel","⛽","Diesel"],["estoque","📦","Estoque"],["custos","💰","Custos"],["colheita","🌽","Colheita"],["romaneios","🚛","Romaneios"],["mapas","🗺️","Mapas"],["relatorios","📊","Relatórios"]
];
let state=JSON.parse(localStorage.getItem("terraSanta")||'{"fazendas":[],"talhoes":[],"safras":[],"aplicacoes":[]}');
function saveLocal(){localStorage.setItem("terraSanta",JSON.stringify(state))}
async function salvarEstado(){
  saveLocal();
  const {fazendas,...dados}=state;
  await supabaseRequest("app_state?id=eq.1",{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({dados})});
}
async function carregarEstado(){
  const remoto=await supabaseRequest("app_state?id=eq.1&select=dados");
  if(Array.isArray(remoto)&&remoto[0]){
    const d=remoto[0].dados||{};
    const localSemFazendas=Object.fromEntries(Object.entries(state).filter(([k])=>k!=="fazendas"));
    const remotoTemDados=Object.values(d).some(v=>Array.isArray(v)?v.length>0:(v&&typeof v==="object"?Object.keys(v).length>0:Boolean(v)));
    const localTemDados=Object.values(localSemFazendas).some(v=>Array.isArray(v)?v.length>0:(v&&typeof v==="object"?Object.keys(v).length>0:Boolean(v)));
    if(!remotoTemDados && localTemDados){
      await salvarEstado();
      return;
    }
    state={...state,...d,fazendas:state.fazendas||[]};
    state.talhoes=Array.isArray(state.talhoes)?state.talhoes:[];
    state.safras=Array.isArray(state.safras)?state.safras:[];
    state.aplicacoes=Array.isArray(state.aplicacoes)?state.aplicacoes:[];
    for(const k of ["plantio","maquinas","diesel","estoque","custos","colheita","romaneios","movimentacoes"]) state[k]=Array.isArray(state[k])?state[k]:[];
    saveLocal();
  }
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function nav(active){document.getElementById("menu").innerHTML=modules.map(m=>`<button class="${m[0]===active?"active":""}" onclick="go('${m[0]}')">${m[1]} ${m[2]}</button>`).join("")}
function go(page){
  location.hash=page;
  render();
}
function dashboard(){
return `<div class="hero"><h1>Bom dia! 🌱</h1><p>Painel da sua operação agrícola</p></div>
<div class="grid">
<div class="card metric"><div class="muted">Área cadastrada</div><div class="num">${state.fazendas.reduce((s,f)=>s+Number(f.area||0),0).toLocaleString("pt-BR")} ha</div></div>
<div class="card metric"><div class="muted">Talhões</div><div class="num">${state.talhoes.length}</div></div>
<div class="card metric"><div class="muted">Safras</div><div class="num">${state.safras.length}</div></div>
<div class="card metric"><div class="muted">Aplicações</div><div class="num">${state.aplicacoes.length}</div></div>
<div class="card metric"><div class="muted">Estoque</div><div class="num">${(state.estoque||[]).length} itens</div></div>
<div class="card metric"><div class="muted">Custos</div><div class="num">R$ ${(state.custos||[]).reduce((s,x)=>s+Number(x.valor||0),0).toLocaleString("pt-BR",{maximumFractionDigits:0})}</div></div>
</div>
<div class="panel"><b>Safra atual</b><div class="muted">${state.safras.length?esc(state.safras[state.safras.length-1].nome)+" — "+esc(state.safras[state.safras.length-1].cultura):"Nenhuma safra cadastrada"}</div></div>
<div class="section"><h2>Acesso rápido</h2><div class="actions">
${[["🌱","talhoes","Novo Talhão"],["💧","aplicacoes","Nova Aplicação"],["🌾","plantio","Registrar Plantio"],["📦","estoque","Estoque"]].map(x=>`<button class="action" onclick="go('${x[1]}')"><span class="icon">${x[0]}</span><strong>${x[2]}</strong><span class="muted">Acessar módulo</span></button>`).join("")}
</div></div>
<div class="panel"><div class="row"><div><b>Segurança dos dados</b><div class="muted">Faça uma cópia dos dados do Terra Santa quando desejar.</div></div><div><button class="secondary" onclick="exportarBackup()">Exportar backup</button> <button class="secondary" onclick="document.getElementById('importBackup').click()">Importar backup</button><input id="importBackup" type="file" accept=".json,application/json" style="display:none" onchange="importarBackup(event)"></div></div></div>`;
}
function listPage(type,title,desc,button,formHtml,rows,headers){
return `<div class="row"><div><h1 style="margin:0">${title}</h1><div class="muted">${desc}</div></div><button class="primary" onclick="toggleForm('${type}')">${button}</button></div>
<div id="${type}Form" class="panel" style="display:none">${formHtml}</div>
<div class="panel"><div class="toolbar"><input placeholder="Pesquisar..." oninput="filtrarTabela(this)"></div><div style="overflow-x:auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nenhum cadastro ainda.</td></tr>`}</tbody></table></div></div>`;
}
function toggleForm(id){let e=document.getElementById(id+"Form");if(e)e.style.display=e.style.display==="none"?"block":"none"}
function fazendas(){
let rows=state.fazendas.map((f,i)=>`<tr><td>${esc(f.nome)}</td><td>${esc(f.area)} ha</td><td>${esc(f.local||"-")}</td><td>Ativa</td><td><button class="danger" onclick="del('fazendas',${i})">Excluir</button></td></tr>`).join("");
return listPage("fazendas","Fazendas","Cadastre as propriedades da operação.","+ Nova Fazenda",`<form onsubmit="addFarm(event)"><div class="form"><div class="field"><label>Nome da fazenda *</label><input id="fnome" required placeholder="Ex.: Fazenda Terra Santa"></div><div class="field"><label>Área total (ha) *</label><input id="farea" type="number" step="0.01" required value="1050"></div><div class="field full"><label>Município / UF</label><input id="flocal" placeholder="Ex.: Sinop - MT"></div></div><br><button class="primary">Salvar fazenda</button></form>`,rows,["Fazenda","Área","Localização","Status",""])}
function talhoes(){
let farms=state.fazendas.length?state.fazendas.map(f=>`<option>${esc(f.nome)}</option>`).join(""):`<option>Fazenda Terra Santa</option>`;
let rows=state.talhoes.map((t,i)=>`<tr><td>${esc(t.nome)}</td><td>${esc(t.area)} ha</td><td>${esc(t.cultura||"-")}</td><td>${esc(t.safra||"-")}</td><td><button class="danger" onclick="del('talhoes',${i})">Excluir</button></td></tr>`).join("");
return listPage("talhoes","Talhões","O talhão será o centro para plantio, aplicações, custos, produtividade e mapas.","+ Novo Talhão",`<form onsubmit="addTalhao(event)"><div class="form"><div class="field"><label>Nome / número *</label><input id="tnome" required placeholder="Talhão 01"></div><div class="field"><label>Área (ha) *</label><input id="tarea" type="number" step="0.01" required></div><div class="field"><label>Fazenda</label><select id="tfarm">${farms}</select></div><div class="field"><label>Cultura</label><select id="tcultura"><option>Soja</option><option>Milho</option><option>Algodão</option><option>Outra</option></select></div><div class="field"><label>Safra</label><input id="tsafra" placeholder="2026/27"></div><div class="field"><label>Variedade / híbrido</label><input id="tvar" placeholder="Opcional"></div><div class="field full"><label>Observações</label><textarea id="tobs" rows="3"></textarea></div></div><br><button class="primary">Salvar talhão</button></form>`,rows,["Talhão","Área","Cultura","Safra",""])}
function safras(){
let rows=state.safras.map((x,i)=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.cultura)}</td><td>${esc(x.inicio||"-")}</td><td>${esc(x.fim||"-")}</td><td><button class="secondary" onclick="editar('safras',${i})">Editar</button> <button class="danger" onclick="del('safras',${i})">Excluir</button></td></tr>`).join("");
return listPage("safras","Safras","Organize os lançamentos por safra e cultura.","+ Nova Safra",`<form onsubmit="addSafra(event)"><div class="form"><div class="field"><label>Safra *</label><input id="snome" required placeholder="2026/27"></div><div class="field"><label>Cultura *</label><select id="scultura"><option>Soja</option><option>Milho</option><option>Algodão</option><option>Outra</option></select></div><div class="field"><label>Início</label><input id="sinicio" type="date"></div><div class="field"><label>Fim</label><input id="sfim" type="date"></div></div><br><button class="primary">Salvar safra</button></form>`,rows,["Safra","Cultura","Início","Fim",""])}
function plantio(){state.plantio=state.plantio||[];let opts=state.talhoes.map(t=>`<option>${esc(t.nome)}</option>`).join("")||"<option>Cadastre um talhão primeiro</option>";let rows=state.plantio.map((x,i)=>`<tr><td>${esc(x.data)}</td><td>${esc(x.talhao)}</td><td>${esc(x.cultura)}</td><td>${esc(x.variedade||"-")}</td><td>${esc(x.populacao||"-")}</td><td><button class="secondary" onclick="editar('plantio',${i})">Editar</button> <button class="danger" onclick="del('plantio',${i})">Excluir</button></td></tr>`).join("");return listPage("plantio","Plantio","Registre o plantio por talhão.","+ Registrar Plantio",`<form onsubmit="addPlantio(event)"><div class="form"><div class="field"><label>Data *</label><input id="pdata" type="date" required></div><div class="field"><label>Talhão *</label><select id="ptalhao">${opts}</select></div><div class="field"><label>Cultura *</label><select id="pcultura"><option>Soja</option><option>Milho</option><option>Algodão</option><option>Outra</option></select></div><div class="field"><label>Variedade / híbrido</label><input id="pvar"></div><div class="field"><label>População / sementes ha</label><input id="ppop"></div><div class="field"><label>Safra</label><input id="psafra" placeholder="2026/27"></div></div><br><button class="primary">Salvar plantio</button></form>`,rows,["Data","Talhão","Cultura","Variedade","População",""])}
function maquinas(){state.maquinas=state.maquinas||[];let rows=state.maquinas.map((x,i)=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.tipo||"-")}</td><td>${esc(x.modelo||"-")}</td><td>${esc(x.horas||"-")}</td><td><button class="secondary" onclick="editar('maquinas',${i})">Editar</button> <button class="danger" onclick="del('maquinas',${i})">Excluir</button></td></tr>`).join("");return listPage("maquinas","Máquinas","Cadastre tratores, colheitadeiras e implementos.","+ Nova Máquina",`<form onsubmit="addMaquina(event)"><div class="form"><div class="field"><label>Nome *</label><input id="mnome" required placeholder="Ex.: S550"></div><div class="field"><label>Tipo</label><input id="mtipo" placeholder="Colheitadeira"></div><div class="field"><label>Modelo</label><input id="mmodelo"></div><div class="field"><label>Horas atuais</label><input id="mhoras" type="number" step="0.1"></div></div><br><button class="primary">Salvar máquina</button></form>`,rows,["Máquina","Tipo","Modelo","Horas",""])}
function diesel(){state.diesel=state.diesel||[];let maq=state.maquinas?.map(m=>`<option>${esc(m.nome)}</option>`).join("")||"<option>-</option>";let tal=state.talhoes.map(t=>`<option>${esc(t.nome)}</option>`).join("")||"<option>-</option>";let rows=state.diesel.map((x,i)=>`<tr><td>${esc(x.data)}</td><td>${esc(x.maquina)}</td><td>${esc(x.litros)} L</td><td>${esc(x.talhao||"-")}</td><td><button class="secondary" onclick="editar('diesel',${i})">Editar</button> <button class="danger" onclick="del('diesel',${i})">Excluir</button></td></tr>`).join("");return listPage("diesel","Diesel","Controle abastecimentos e vincule ao talhão quando desejar.","+ Abastecimento",`<form onsubmit="addDiesel(event)"><div class="form"><div class="field"><label>Data *</label><input id="ddata" type="date" required></div><div class="field"><label>Máquina</label><select id="dmaquina">${maq}</select></div><div class="field"><label>Litros *</label><input id="dlitros" type="number" step="0.01" required oninput="calcDiesel()"></div><div class="field"><label>Valor por litro</label><input id="dvalor" type="number" step="0.01"></div><div class="field"><label>Talhão (opcional)</label><select id="dtalhao"><option value="">Não vincular</option>${tal}</select></div></div><br><button class="primary">Salvar abastecimento</button></form>`,rows,["Data","Máquina","Litros","Talhão",""])}

<img id="epreview" class="cameraPreview"><div><button type="button" class="secondary" onclick="lerNotaEstoque()">📷 Ler e separar itens da nota</button></div>

<div id="notaReview" class="notaReview" style="display:none"></div></div></div></div><br><button class="primary">Salvar produto</button></form>`,rows,["Produto","Categoria","Quantidade","Valor",""])}
function custos(){
 state.custos=state.custos||[];
 const total=state.custos.reduce((s,x)=>s+Number(x.valor||0),0)+(state.diesel||[]).reduce((s,x)=>s+(Number(x.litros||0)*Number(x.valor||0)),0);
 const rows=state.custos.map((x,i)=>{

 return `<div class="summary"><div class="card"><div class="muted">Custos registrados</div><div class="num money">R$ ${total.toLocaleString("pt-BR",{minimumFractionDigits:2})}</div></div></div>`+listPage("custos","Custos","Registre despesas da operação.","+ Novo Custo",form,rows,["Data","Descrição","Talhão","Valor","R$/ha",""]);
}

async function reconhecerImagem(inputId,statusId){
 const f=document.getElementById(inputId)?.files?.[0],st=document.getElementById(statusId);
 if(!f){alert("Primeiro tire uma foto ou escolha uma imagem.");return null}
 if(typeof Tesseract==="undefined"){alert("A leitura automática precisa de internet para carregar o leitor.");return null}
 st.textContent="Lendo a imagem… aguarde.";
 try{
   const r=await Tesseract.recognize(f,"por",{logger:m=>{if(m.status==="recognizing text")st.textContent=`Lendo… ${Math.round((m.progress||0)*100)}%`}});
   st.textContent="Leitura concluída. Confira os campos antes de salvar.";
   return r.data.text||"";
 }catch(e){st.textContent="Não consegui ler esta foto. Você pode preencher manualmente.";return null}
}
function numeroBR(s){if(!s)return null;return Number(String(s).replace(/\./g,"").replace(",","."))}
function acharValor(texto,rotulos){
 for(const r of rotulos){
   const m=texto.match(new RegExp(r+"[^\\d]{0,18}([\\d\\.]+[,\\.]\\d{2})","i"));
   if(m)return numeroBR(m[1]);
 } return null;
}
function normalizarUnidade(u){
 u=(u||"").toUpperCase().replace(".","");
 if(["L","LT","LTS","LITRO","LITROS"].includes(u))return "L";
 if(["KG","KGS","QUILO","QUILOS"].includes(u))return "kg";
 if(["TN","TON","T","TONELADA","TONELADAS"].includes(u))return "t";
 if(["BB","SC","SACA","SACAS"].includes(u))return "un";
 return u||"un";
}
function categoriaSugerida(nome){
 const n=(nome||"").toUpperCase();
 if(/DIESEL|OLEO DIESEL|ÓLEO DIESEL/.test(n))return "Diesel";
 if(/SEMENT|SOJA|MILHO|TRIGO|HERA|OLIMPO/.test(n))return "Semente";
 if(/CALCAR|GESSO|ADUB|FERTIL|MAP|KCL|UREIA/.test(n))return "Fertilizante";
 if(/HERB|GLIF|GLUF|CLIPPER|INSET|FUNG|INSETIC|FUNGIC|2,4-D/.test(n))return "Defensivo";
 if(/PECA|PEÇA|FILTRO|ROLAMENTO|CORREIA/.test(n))return "Peça";
 return "Outros";
}
function extrairItensNota(t){
 const linhas=t.split(/\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean), itens=[];
 for(let i=0;i<linhas.length;i++){
   const l=linhas[i], up=l.toUpperCase();
   if(/DESCRI|PRODUTO\/SERVI|NCM|CFOP|VALOR TOTAL|DADOS DOS PRODUTOS/.test(up))continue;
   let m=l.match(/(.{4,}?)\s+(KG|KGS|L|LT|LTS|TN|TON|BB|UN)\s+([\d\.,]+)\s+([\d\.,]+)\s+([\d\.,]+)/i);
   if(!m) m=l.match(/(.{4,}?)\s+(KG|KGS|L|LT|LTS|TN|TON|BB|UN)\s+([\d\.,]+)/i);
   if(m){
     const nome=m[1].replace(/^\d+\s+/,"").trim();
     if(/[A-Za-zÁ-ú]{3,}/.test(nome)){
       itens.push({produto:nome.slice(0,100),unidade:normalizarUnidade(m[2]),quantidade:numeroBR(m[3])||0,
         valorUnit:m[4]?numeroBR(m[4]):0,valorTotal:m[5]?numeroBR(m[5]):0,lote:"",categoria:categoriaSugerida(nome)});
     }
   }
 }
 // Lotes may appear on continuation lines.
 for(const it of itens){
   const idx=linhas.findIndex(x=>x.includes(it.produto.slice(0,18)));
   const trecho=linhas.slice(Math.max(0,idx),Math.min(linhas.length,idx+3)).join(" ");
   const lm=trecho.match(/LOTE[:\s\-]*([A-Z0-9\-\/]+)/i); if(lm)it.lote=lm[1];
 }
 return itens;
}

function recalcularItemNota(row,origem){
 const q=row.querySelector('[data-k="quantidade"]'), vu=row.querySelector('[data-k="valorUnit"]'), vt=row.querySelector('[data-k="valorTotal"]');
 if(!q||!vt)return;
 const qtd=Number(q.value||0), unit=vu?Number(vu.value||0):0, total=Number(vt.value||0);
 const alvo=document.activeElement?.dataset?.k;
 if(vu){
   if(alvo==="valorTotal" && qtd>0)vu.value=(total/qtd).toFixed(4);
   else if((alvo==="quantidade"||alvo==="valorUnit") && qtd>=0)vt.value=(qtd*unit).toFixed(2);
 }
}

async function addAplicacao(e){

 const talhaoObj=state.talhoes.find(t=>t.nome===talhaoNome), area=Number(talhaoObj?.area||0);

 const linhas=[...document.querySelectorAll(".produtoLinha")];
 if(!linhas.length){alert("Adicione pelo menos um produto.");return}
 let produtos=[],custoTotal=0;
 for(const l of linhas){
   const idx=Number(l.querySelector(".aprProduto").value),dose=Number(l.querySelector(".aprDose").value),item=state.estoque[idx];
   if(!item||!dose){alert("Confira produto e dose.");return}
   const qtd=dose*area,disp=Number(item.quantidade||0);
   if(qtd>disp){alert(`Estoque insuficiente de ${item.produto}. Necessário ${qtd.toLocaleString("pt-BR")} ${item.unidade}; disponível ${disp.toLocaleString("pt-BR")} ${item.unidade}.`);return}
   const valor=Number(item.valor||0),unit=disp?valor/disp:0,custo=qtd*unit;
   produtos.push({produto:item.produto,dose,quantidade:qtd,unidade:item.unidade,custo});
   custoTotal+=custo;
 }
 for(const p of produtos){const item=state.estoque.find(x=>x.produto===p.produto);item.quantidade=Number(item.quantidade||0)-p.quantidade;item.valor=Math.max(0,Number(item.valor||0)-p.custo)}
 const id="apl_"+Date.now();
 state.aplicacoes.push({id,data:adata.value,talhao:talhaoNome,area,produtos,custo:custoTotal,obs:aobs.value});
 state.custos.push({id:"custo_"+id,origem:"aplicacao",aplicacaoId:id,data:adata.value,descricao:`Aplicação — ${talhaoNome}`,categoria:"Insumos",valor:custoTotal,talhao:talhaoNome});

async function del(type,i){
  if(!confirm("Excluir este registro?")) return;
  try {
    if(type === "fazendas"){
      const item = state.fazendas[i];
      if(!item || !item.id) throw new Error("Não encontrei o ID desta fazenda no banco.");
      await supabaseRequest(`fazendas?id=eq.${encodeURIComponent(item.id)}`, {method:"DELETE"});
      await carregarFazendas();
      render();
      return;
    }
    if(type==="aplicacoes"){
      const a=state.aplicacoes[i];
      if(a&&a.id){
        if(Array.isArray(a.produtos)){
          for(const p of a.produtos){
            const item=(state.estoque||[]).find(x=>x.produto===p.produto);
            if(item){
              item.quantidade=Number(item.quantidade||0)+Number(p.quantidade||0);
              item.valor=Number(item.valor||0)+Number(p.custo||0);
            }
          }
        } else if(a.quantidade!=null){
          const item=(state.estoque||[]).find(x=>x.produto===a.produto);
          if(item){
            item.quantidade=Number(item.quantidade||0)+Number(a.quantidade||0);
            item.valor=Number(item.valor||0)+Number(a.custo||0);
          }
        }
        state.custos=(state.custos||[]).filter(c=>c.aplicacaoId!==a.id);
      }
    }
    state[type].splice(i,1);
    await salvarEstado();
    render();
  } catch(erro){
    alert("Erro ao excluir: " + erro.message);
  }
}

async function carregarFazendas(){
  try {
    const dados = await supabaseRequest("fazendas?select=*&order=nome.asc");
    if (Array.isArray(dados)) {
      state.fazendas = dados.map(f => ({nome:f.nome, area:f.area_total, local:f.municipio, id:f.id}));
    }
  } catch(erro) { console.error("Erro ao carregar fazendas:", erro); }
}

async function iniciar(){
  try{
    await Promise.all([carregarFazendas(),carregarEstado()]);
  }catch(erro){
    console.error("Erro ao sincronizar dados:",erro);
    alert("Não foi possível sincronizar todos os dados. Verifique a configuração do Supabase.");
  }
  render();
}

window.addEventListener("hashchange",render);
let ultimaSincronizacao=0;
async function atualizarAoVoltar(){
  const agora=Date.now();
  if(agora-ultimaSincronizacao<1500)return;
  ultimaSincronizacao=agora;
  try{
    await Promise.all([carregarFazendas(),carregarEstado()]);
    render();
  }catch(erro){console.error("Erro ao atualizar dados:",erro);}
}
window.addEventListener("pageshow",atualizarAoVoltar);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")atualizarAoVoltar();});
iniciar();
